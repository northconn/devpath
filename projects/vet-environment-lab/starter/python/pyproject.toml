[project]
name = "vet-environment-lab-starter"
version = "0.1.0"
description = "Ponto de partida do Vet Environment Lab"
requires-python = ">=3.12"

[project.scripts]
vet-environment-lab = "vet_environment_lab.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vet_environment_lab"]
